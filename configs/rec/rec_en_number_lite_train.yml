Global:
  language: en
  task: rec
  use_gpu: True
  epoch_num: 500
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: output/rec_en_number_lite
  save_epoch_step: 3
  eval_batch_step: [0, 2000]
  cal_metric_during_train: True
  checkpoints: model_weights/en_number_mobile_v2.0_rec_infer.pth
  use_visualdl: False
  character_dict_path: pytorchocr/dicts/en_dict.txt
  max_text_length: 25
  infer_mode: False
  use_space_char: True


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
  weight_decay: 0.00001

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: small
    small_stride: [1, 2, 2, 2]
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 48
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: RecognitionDataset
    data_dir: ./ICDAR2015
    image_transforms:
      - RecAug: 
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - ToTensor:
      - Normalize:
          mean: [0.5, 0.5, 0.5]
          std: [0.5, 0.5, 0.5]
    label_transforms:
      - CTCLabelEncode:
          max_text_length: 25
          character_dict_path: pytorchocr/dicts/en_dict.txt
      - ToLabelTensor:
  loader:
    shuffle: True
    batch_size_per_card: 256
    drop_last: False
    num_workers: 8

Eval:
  dataset:
    name: RecognitionDataset
    data_dir: ./ICDAR2015
    image_transforms:
      - RecResizeImg:
          image_shape: [3, 32, 320]
      - ToTensor:
      - Normalize:
          mean: [0.5, 0.5, 0.5]
          std: [0.5, 0.5, 0.5]
    label_transforms:
      - CTCLabelEncode:
          max_text_length: 25
          character_dict_path: pytorchocr/dicts/en_dict.txt
      - ToLabelTensor:
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 256
    num_workers: 8
